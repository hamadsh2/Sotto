[package]
name = "sotto"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Just your voice. Lightweight real-time mic noise suppression for Windows."
repository = "https://github.com/hamadsh2/Sotto"
publish = false

[dependencies]
cpal = "0.18.2"
ringbuf = "0.6.0"
# default features pull in a CLI (clap, hound, ...) we don't need
nnnoiseless = { version = "0.5.2", default-features = false }
# DeepFilterNet (MIT/Apache-2.0, code and model weights). The model-running version
# isn't on crates.io (latest there is 0.2.5 without inference), so it's pinned to an
# exact commit. "tract" = ONNX inference; "default-model" embeds DeepFilterNet3
# (~8 MB). Default features are off: they add audio file decoders we don't use.
deep_filter = { git = "https://github.com/Rikorose/DeepFilterNet", rev = "7b14b895fe7fc42cab72b4a4c1e49c982bd6404b", default-features = false, features = ["tract", "default-model"] }
# Must match the ndarray version deep_filter uses (its audio arrays are this type).
ndarray = "0.15.6"
gpui = "=0.2.2"
gpui-component = "=0.5.1"
tray-icon = "0.26.1"
directories = "6"
serde = { version = "1.0.229", features = ["derive"] }
toml = "0.8"
global-hotkey = "0.10.0"
self_update = { version = "1.3.3", default-features = false, features = ["ureq", "rustls", "github", "archive-zip", "compression-zip-deflate", "signatures"] }
# Exclusive-mode output to CABLE Input ("Hide my voice from screen shares"). Same
# version and features cpal 0.18.2 already builds, so it adds no new code to compile.
windows = { version = "0.62", features = ["Win32_Media_Audio", "Win32_Foundation", "Win32_Media_KernelStreaming", "Win32_Media_Multimedia", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Threading"] }

# Keep the default panic = "unwind": devices::no_panic relies on it to survive
# cpal panicking when a device is unplugged mid-call. Do not set panic = "abort".
[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
